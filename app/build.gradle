plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'dza.fut.paipo'
    compileSdk 36
    buildFeatures {
        buildConfig = true
    }
    testOptions {
        unitTests.returnDefaultValues = true
        // maquinas chicas (2 GB sin swap): el fork de tests pide por defecto 1/4 de RAM
        // y con el daemon gradle encima el OOM-killer mata la suite a mitad. 224m alcanzan.
        unitTests.all {
            maxHeapSize = '224m'
        }
    }
    defaultConfig {
        applicationId "dza.fut.paipo"
        minSdk 30
        targetSdk 34
        versionCode 26
        versionName "7.8.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // Media3: TODAS las dependencias en la misma versión (antes 1.2.0 + 1.10.1 -> crash en runtime)
    implementation libs.media3.exoplayer
    implementation libs.media3.exoplayer.hls
    implementation libs.media3.ui
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'   // AppIntro (ViewPager2)
    // Jsoup para extraer enlaces
    implementation 'org.jsoup:jsoup:1.17.2'

    implementation libs.appcompat
    implementation libs.material
    // (eliminado) play-services-maps3d: no se usa en ninguna clase
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    // v3.2.40: publicidad eliminada "por ahora" (el SDK de Start.io quedo fuera del
    // build: ni init, ni banner, ni meta-data — ver git log v3.2.40 para reponer).
}